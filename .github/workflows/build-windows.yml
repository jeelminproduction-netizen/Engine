
name: Build Engine Windows

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Get engine source
        uses: actions/checkout@v4

     
      - name: Install ISPC compiler
        uses: ispc/install-ispc-action@main
        with:
          version: 1.22.0

      - name: Configure engine
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Compile graphics demo
        shell: pwsh
        run: |
          cmake --build build --config Release --target geom_compression --parallel 4

      - name: Package executable and resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          $bin = "build/output/bin/Release"
          if (!(Test-Path "$bin/geom_compression.exe")) {
            throw "Demo executable not found"
          }
          Copy-Item "$bin/*" package -Recurse -Force
          Copy-Item res package/res -Recurse -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Engine-Windows-x64
          path: package/
          if-no-files-found: error
